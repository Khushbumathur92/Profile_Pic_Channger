<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3D File Input Button</title>
    <style>  
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        body {
            background-image: linear-gradient(orange, blue);
            background-repeat: no-repeat;
            background-size: cover;
        }
        #one{
            height: 200px;
            width: 200px;
            border: 1px solid;
            border-radius: 100px;
            background-repeat: no-repeat;
            background-size: cover; /* Ensure image covers the entire div */
            background-position: center;
            box-shadow: 4px 4px 8px rgba(1, 1, 1, 1.5);
            position: relative; /* Ensure the child image is positioned correctly */
            overflow: hidden; /* Hide any overflow if the image doesn't fit perfectly */
        }
        #two{
            margin-left:40%;
            margin-top: 10px;
        }

        /* Hide the default file button */
        input[type="file"]::-webkit-file-upload-button {
            display: none;
        }

        /* Add custom 'Choose File' text */
        input[type="file"]::before {
            content: "Choose File"; /* Display 'Choose File' */
            color: black; /* Text color */
            font-size: 14px; /* Font size */
            font-weight: bold; /* Font weight */
            display: block;
            text-align: center;
            line-height: 30px; /* Vertical center text */
            border: 1px solid black;
            width: 150px;
            border-radius: 20px;
            box-shadow: 10px 10px 25px rgba(2, 2, 2, 2.4), inset 2px 2px 5px rgba(255, 255, 255, 0.5); /* Deeper shadow beneath button */
            cursor: pointer;
            transition: all 0.2s ease; /* Smooth transition for hover effects */
        }

        /* Normal state - with shadow beneath the button */
        input[type="file"]::before {
            box-shadow: 4px 4px 25px rgba(0, 0, 0, 0.4), inset 1px 1px 5px rgba(255, 255, 255, 0.5); /* Stronger shadow beneath */
        }

        /* Hover effect for the 3D button */
        input[type="file"]::before:hover {
            box-shadow: 4px 4px 4px rgba(0, 0, 0, 0.5), inset 1px 1px 5px rgba(255, 255, 255, 0.4);
            transform: translateY(-2px); /* Slightly lift the button */
        }

        /* Pressing effect */
        input[type="file"]:active::before {
            box-shadow: 4px 2px 4px rgba(4, 4, 4, 0.5), inset 2px 2px 8px rgba(255, 255, 255, 0.4); /* Shadow reduces when pressed */
            transform: translateY(2px);  Move the button down to simulate pressing 
        }

        /* Focus effect */
        input[type="file"]::before:focus {
            outline: none;
            box-shadow: 1px 1px  2px /*rgba(0, 123, 255, 0.5);*/
        }

        input[type="file"] {
            color: transparent; /* Hide the file name */
        }

        img {
            object-fit: cover; /* Ensure the image covers the entire div without distortion */
            width: 100%;
            height: 100%;
            border: 1px solid black;
            border-radius: 50%;
        }
    </style>    
</head>
<body>
    <div id="one"><img id="imagePreview" src="C:\Users\LENOVO\OneDrive\Desktop\My all Projects\ProfilePicChanger\User1.webp" alt="User Image"></div>
    <input type="file" id="two" onchange="previewImage()" class="one">
</body>
<script>
    function previewImage() {
        let fileInput = document.getElementById('two');
        let preview = document.getElementById('imagePreview');
        let file = fileInput.files[0]; // Access the selected file

        if (file) {
            let url = URL.createObjectURL(file); // Generate a temporary URL
            preview.src = url; // Set the image source to the uploaded file
        }
    }
</script>
</html>
